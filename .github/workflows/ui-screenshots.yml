name: UI Screenshots

on:
  push:
    branches:
      - main
      - "feature/ios-style-ui"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleFdroidDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            mkdir -p screenshots
            adb install -r app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
            adb shell pm grant io.heckel.ntfy.debug android.permission.POST_NOTIFICATIONS || true

            adb shell am start -W -n io.heckel.ntfy.debug/io.heckel.ntfy.ui.MainActivity
            sleep 5
            adb exec-out screencap -p > screenshots/01-main-light.png

            # Open the add-subscription modal from the FAB
            adb shell input tap 953 2187
            sleep 3
            adb exec-out screencap -p > screenshots/02-add-light-keyboard.png
            adb shell input keyevent 4
            sleep 1
            adb exec-out screencap -p > screenshots/03-add-light.png
            adb shell am force-stop io.heckel.ntfy.debug
            adb shell am start -W -n io.heckel.ntfy.debug/io.heckel.ntfy.ui.MainActivity
            sleep 3

            # Open the overflow menu and tap Settings
            adb shell input tap 1006 208
            sleep 1
            adb exec-out screencap -p > screenshots/04-menu-light.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            coords=$(adb shell cat /sdcard/window.xml | python3 .github/scripts/find_ui_node.py "Settings" "main_menu_settings")
            echo "Settings menu coordinates: ${coords:-not found}"
            if [ -n "$coords" ]; then adb shell input tap $coords; else adb shell input tap 800 300; fi
            sleep 4
            adb exec-out screencap -p > screenshots/05-settings-light.png
            adb shell input keyevent 4
            sleep 2

            adb shell am start -W -n io.heckel.ntfy.debug/io.heckel.ntfy.ui.DetailActivity \
              --el subscriptionId 1 \
              --es subscriptionBaseUrl "https://ntfy.sh" \
              --es subscriptionTopic "demo-topic" \
              --es subscriptionDisplayName "Demo topic" \
              --el subscriptionMutedUntil 0
            sleep 4
            adb exec-out screencap -p > screenshots/06-detail-light.png

            adb shell cmd uimode night yes
            adb shell am force-stop io.heckel.ntfy.debug
            sleep 2
            adb shell am start -W -n io.heckel.ntfy.debug/io.heckel.ntfy.ui.MainActivity
            sleep 4
            adb exec-out screencap -p > screenshots/07-main-dark.png

            adb shell input tap 1006 208
            sleep 1
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            coords=$(adb shell cat /sdcard/window.xml | python3 .github/scripts/find_ui_node.py "Settings" "main_menu_settings")
            echo "Settings menu coordinates (dark): ${coords:-not found}"
            if [ -n "$coords" ]; then adb shell input tap $coords; else adb shell input tap 800 300; fi
            sleep 3
            adb exec-out screencap -p > screenshots/08-settings-dark.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
